<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="usGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3d5a80;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#293241;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#c1121f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#780000;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>

  <!-- Grid pattern -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>

  <!-- US Side - Distributed structure -->
  <g transform="translate(150, 250)">
    <!-- Central node - Citizens -->
    <circle cx="0" cy="0" r="35" fill="url(#usGrad)" stroke="#98c1d9" stroke-width="2" filter="url(#glow)"/>
    <text x="0" y="5" text-anchor="middle" fill="#e0fbfc" font-family="Arial, sans-serif" font-size="11" font-weight="bold">CITIZENS</text>

    <!-- Distributed nodes -->
    <circle cx="-80" cy="-90" r="25" fill="url(#usGrad)" stroke="#98c1d9" stroke-width="1.5"/>
    <text x="-80" y="-87" text-anchor="middle" fill="#e0fbfc" font-family="Arial, sans-serif" font-size="8">CONGRESS</text>

    <circle cx="80" cy="-90" r="25" fill="url(#usGrad)" stroke="#98c1d9" stroke-width="1.5"/>
    <text x="80" y="-87" text-anchor="middle" fill="#e0fbfc" font-family="Arial, sans-serif" font-size="8">COURTS</text>

    <circle cx="-100" cy="30" r="25" fill="url(#usGrad)" stroke="#98c1d9" stroke-width="1.5"/>
    <text x="-100" y="33" text-anchor="middle" fill="#e0fbfc" font-family="Arial, sans-serif" font-size="8">EXEC</text>

    <circle cx="100" cy="30" r="25" fill="url(#usGrad)" stroke="#98c1d9" stroke-width="1.5"/>
    <text x="100" y="33" text-anchor="middle" fill="#e0fbfc" font-family="Arial, sans-serif" font-size="8">MILITARY</text>

    <circle cx="0" cy="100" r="25" fill="url(#usGrad)" stroke="#98c1d9" stroke-width="1.5"/>
    <text x="0" y="103" text-anchor="middle" fill="#e0fbfc" font-family="Arial, sans-serif" font-size="8">PUBLIC</text>

    <!-- Connecting lines - bidirectional -->
    <g stroke="#98c1d9" stroke-width="1" stroke-opacity="0.6">
      <line x1="0" y1="-35" x2="-55" y2="-70"/>
      <line x1="0" y1="-35" x2="55" y2="-70"/>
      <line x1="-30" y1="15" x2="-75" y2="15"/>
      <line x1="30" y1="15" x2="75" y2="15"/>
      <line x1="0" y1="35" x2="0" y2="75"/>
      <line x1="-55" y1="-70" x2="-80" y2="5"/>
      <line x1="55" y1="-70" x2="80" y2="5"/>
    </g>
  </g>

  <!-- China Side - Hierarchical structure -->
  <g transform="translate(650, 250)">
    <!-- Top node - Party -->
    <circle cx="0" cy="-100" r="40" fill="url(#cnGrad)" stroke="#ffd60a" stroke-width="2" filter="url(#glow)"/>
    <text x="0" y="-97" text-anchor="middle" fill="#fff3b0" font-family="Arial, sans-serif" font-size="12" font-weight="bold">PARTY</text>

    <!-- Second tier -->
    <circle cx="-60" cy="-20" r="22" fill="url(#cnGrad)" stroke="#ffd60a" stroke-width="1.5"/>
    <text x="-60" y="-17" text-anchor="middle" fill="#fff3b0" font-family="Arial, sans-serif" font-size="7">STATE</text>

    <circle cx="60" cy="-20" r="22" fill="url(#cnGrad)" stroke="#ffd60a" stroke-width="1.5"/>
    <text x="60" y="-17" text-anchor="middle" fill="#fff3b0" font-family="Arial, sans-serif" font-size="7">MILITARY</text>

    <!-- Third tier -->
    <circle cx="-80" cy="60" r="18" fill="url(#cnGrad)" stroke="#ffd60a" stroke-width="1"/>
    <text x="-80" y="63" text-anchor="middle" fill="#fff3b0" font-family="Arial, sans-serif" font-size="6">AGENCY</text>

    <circle cx="0" cy="60" r="18" fill="url(#cnGrad)" stroke="#ffd60a" stroke-width="1"/>
    <text x="0" y="63" text-anchor="middle" fill="#fff3b0" font-family="Arial, sans-serif" font-size="6">AGENCY</text>

    <circle cx="80" cy="60" r="18" fill="url(#cnGrad)" stroke="#ffd60a" stroke-width="1"/>
    <text x="80" y="63" text-anchor="middle" fill="#fff3b0" font-family="Arial, sans-serif" font-size="6">AGENCY</text>

    <!-- Bottom - Companies -->
    <rect x="-90" y="100" width="180" height="30" rx="5" fill="url(#cnGrad)" stroke="#ffd60a" stroke-width="1"/>
    <text x="0" y="120" text-anchor="middle" fill="#fff3b0" font-family="Arial, sans-serif" font-size="10">COMPANIES COMPLY</text>

    <!-- Connecting lines - top-down arrows -->
    <g stroke="#ffd60a" stroke-width="1.5" stroke-opacity="0.7">
      <line x1="-20" y1="-65" x2="-50" y2="-40"/>
      <line x1="20" y1="-65" x2="50" y2="-40"/>
      <line x1="-60" y1="2" x2="-75" y2="42"/>
      <line x1="-45" y1="0" x2="0" y2="42"/>
      <line x1="60" y1="2" x2="75" y2="42"/>
      <line x1="-80" y1="78" x2="-60" y2="100"/>
      <line x1="0" y1="78" x2="0" y2="100"/>
      <line x1="80" y1="78" x2="60" y2="100"/>
    </g>

    <!-- Arrow heads -->
    <g fill="#ffd60a" fill-opacity="0.7">
      <polygon points="-50,-40 -55,-48 -45,-45"/>
      <polygon points="50,-40 45,-48 55,-45"/>
      <polygon points="-60,100 -65,92 -55,95"/>
      <polygon points="0,100 -5,92 5,92"/>
      <polygon points="60,100 55,92 65,95"/>
    </g>
  </g>

  <!-- Center dividing line -->
  <line x1="400" y1="80" x2="400" y2="420" stroke="#ffffff" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="5,5"/>

  <!-- Question mark in center -->
  <g transform="translate(400, 250)">
    <circle cx="0" cy="0" r="45" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.4"/>
    <text x="0" y="12" text-anchor="middle" fill="#ffffff" font-family="Georgia, serif" font-size="48" font-weight="bold" opacity="0.6">?</text>
  </g>

  <!-- Labels -->
  <text x="150" y="60" text-anchor="middle" fill="#98c1d9" font-family="Arial, sans-serif" font-size="18" font-weight="bold">REPUBLIC</text>
  <text x="150" y="82" text-anchor="middle" fill="#98c1d9" font-family="Arial, sans-serif" font-size="11" opacity="0.8">Authority from Citizens</text>

  <text x="650" y="60" text-anchor="middle" fill="#ffd60a" font-family="Arial, sans-serif" font-size="18" font-weight="bold">PARTY</text>
  <text x="650" y="82" text-anchor="middle" fill="#ffd60a" font-family="Arial, sans-serif" font-size="11" opacity="0.8">Authority from Itself</text>

  <!-- Bottom text -->
  <text x="400" y="460" text-anchor="middle" fill="#ffffff" font-family="Georgia, serif" font-size="14" opacity="0.7">Who decides what AI can and cannot do?</text>

  <!-- AI nodes floating -->
  <g fill="#00f5d4" fill-opacity="0.6">
    <circle cx="280" cy="180" r="6"/>
    <circle cx="320" cy="320" r="6"/>
    <circle cx="480" cy="180" r="6"/>
    <circle cx="520" cy="320" r="6"/>
  </g>
  <text x="280" y="200" text-anchor="middle" fill="#00f5d4" font-family="Arial, sans-serif" font-size="8" opacity="0.8">AI</text>
  <text x="320" y="340" text-anchor="middle" fill="#00f5d4" font-family="Arial, sans-serif" font-size="8" opacity="0.8">AI</text>
  <text x="480" y="200" text-anchor="middle" fill="#00f5d4" font-family="Arial, sans-serif" font-size="8" opacity="0.8">AI</text>
  <text x="520" y="340" text-anchor="middle" fill="#00f5d4" font-family="Arial, sans-serif" font-size="8" opacity="0.8">AI</text>
</svg>