<!DOCTYPE html>
<html lang="en">
<head>
  {% include head.html %}
</head>
<body>
  {% include header.html %}

  <main class="container">
    <article class="article-content">
      {% if page.featured_image %}
      <div class="article-featured-image" style="margin-bottom: 2rem;">
        <img src="{{ page.featured_image }}" alt="{{ page.title }}" style="width: 100%; max-width: 800px; border-radius: 0.5rem;">
      </div>
      {% endif %}
      {{ content }}
    </article>

    <!-- Giscus Comments -->
    <section class="comments-section" style="margin-top: 3rem; padding-top: 2rem; border-top: 1px solid var(--border-color, #e1e4e8);">
      <h2 style="margin-bottom: 1.5rem;">Comments</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1rem;">Sign in with GitHub to comment, or use the anonymous form below.</p>
      <script src="https://giscus.app/client.js"
              data-repo="jdlongmire/AI-Research"
              data-repo-id="R_kgDOQhOl3Q"
              data-category="General"
              data-category-id="DIC_kwDOQhOl3c4C3ASM"
              data-mapping="pathname"
              data-strict="0"
              data-reactions-enabled="1"
              data-emit-metadata="0"
              data-input-position="top"
              data-theme="preferred_color_scheme"
              data-lang="en"
              data-loading="lazy"
              crossorigin="anonymous"
              async>
      </script>
    </section>

    <!-- Anonymous Feedback Form -->
    <section class="feedback-section" style="margin-top: 2rem; padding-top: 2rem; border-top: 1px solid var(--border-color, #e1e4e8);">
      <h3 style="margin-bottom: 1rem; color: var(--text-primary);">Anonymous Feedback</h3>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1rem;">Don't have a GitHub account? Share your thoughts anonymously.</p>
      <form action="https://formspree.io/jdlongmire@outlook.com" method="POST" class="feedback-form">
        <input type="hidden" name="_subject" value="[AI Research Feedback] {{ page.title | default: 'Article' }}">
        <input type="hidden" name="_page" value="{{ page.url }}">
        <input type="hidden" name="_next" value="{{ site.url }}{{ site.baseurl }}/feedback-thanks.html">
        <div style="margin-bottom: 1rem;">
          <input type="text" name="name" placeholder="Name (optional)"
                 style="width: 100%; padding: 0.75rem; background-color: var(--bg-tertiary); border: 1px solid var(--border-color); border-radius: 0.375rem; color: var(--text-primary); font-family: inherit; font-size: 0.95rem;">
        </div>
        <div style="margin-bottom: 1rem;">
          <input type="email" name="email" placeholder="Email (optional, for reply)"
                 style="width: 100%; padding: 0.75rem; background-color: var(--bg-tertiary); border: 1px solid var(--border-color); border-radius: 0.375rem; color: var(--text-primary); font-family: inherit; font-size: 0.95rem;">
        </div>
        <div style="margin-bottom: 1rem;">
          <textarea name="message" placeholder="Your feedback..." required rows="4"
                    style="width: 100%; padding: 0.75rem; background-color: var(--bg-tertiary); border: 1px solid var(--border-color); border-radius: 0.375rem; color: var(--text-primary); font-family: inherit; font-size: 0.95rem; resize: vertical;"></textarea>
        </div>
        <button type="submit" class="btn btn-secondary" style="cursor: pointer;">
          Send Feedback
        </button>
      </form>
    </section>
  </main>

  {% include footer.html %}

  <!-- Lunr.js for client-side search -->
  <script src="https://cdn.jsdelivr.net/npm/lunr@2.3.9/lunr.min.js"></script>
  <script src="{{ '/assets/js/search.js' | relative_url }}"></script>
</body>
</html>
